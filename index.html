<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>

    <style>
        body {
            background-color: lightblue;
            text-align: center;
            font-family: Arial;
            margin: 0;
        }

        nav {
            background-color: black;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-size: 18px;
        }

        section {
            padding: 60px 20px;
        }

        h1 {
            color: darkblue;
        }

        h2 {
            color: darkblue;
        }

        p {
            font-size: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#safety">Safety</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h1>Hello! I'm Sundhar 👋</h1>
        <p>This is my first website.</p>
        <button onclick="welcome()">Click Me</button>
    </section>

    <section id="about">
        <h2>About Me</h2>
        <p>I am learning web development.</p>
    </section>

    <section id="safety">
        <h2>Safety</h2>
        <p>Safety is important in every workplace.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Thanks for visiting my website!</p>
    </section>

    <script>
        function welcome() {
            alert("🎉 Welcome Sundhar!");
        }
    </script>

</body>
</html>
