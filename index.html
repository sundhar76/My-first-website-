    <title>Sundhar's Safety Website</title>

    <style>
        html {
            scroll-behavior: smooth;

            color: #00d9ff;
        }

            margin: 40px auto;
            padding: 50px 20px;

            transition: 0.4s;
        }

        h1, h2 {
            color: #062c8c;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

            font-size: 15px;

            color: white;

            margin-top: 10px;
        }

        button:hover {
            background-color: #00a8cc;
        }

        .theme-btn {
            background-color: #444;
            margin-left: 10px;
        }
